<body>
    <div class="container">
        <h1>Astrology PDF Report Generator</h1>
        
        <form id="astrologyForm">
            <!-- Report Selection -->
            <div class="form-group">
                <label for="reportType">Select PDF Report <span class="required">*</span></label>
                <select id="reportType" name="reportType" required>
                    <option value="">Select Report</option>
                </select>
            </div>
            
            <!-- Normal Form Fields (shown by default) -->
            <div id="normalForm">
                <!-- Name -->
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name">
                </div>
                
                <!-- Date of Birth -->
                <div class="form-group">
                    <label for="dob">Date of Birth (DD/MM/YYYY) <span class="required">*</span></label>
                    <input type="text" id="dob" name="dob" placeholder="DD/MM/YYYY" >
                </div>
                
                <!-- Time of Birth -->
                <div class="form-group">
                    <label for="tob">Time of Birth (HH:MM) <span class="required">*</span></label>
                    <input type="text" id="tob" name="tob" placeholder="HH:MM" >
                </div>
                
                <!-- Place of Birth (Google Places Autocomplete) -->
                <div class="form-group">
                    <label for="place">Place of Birth <span class="required">*</span></label>
                    <input type="text" id="place" name="place" placeholder="Start typing place name..." >
                </div>
                
                <!-- Hidden fields for Latitude and Longitude -->
                <input type="hidden" id="lat" name="lat">
                <input type="hidden" id="lon" name="lon">
                <input type="hidden" id="tz" name="tz" value="5.5">
                
                <!-- Language -->
                <div class="form-group">
                    <label for="lang">Language <span class="required">*</span></label>
                    <select id="lang" name="lang" required>
                        <option value="">Select Language</option>
                        <option value="en" selected>English</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>
            </div>
            
            <!-- Matching Form Fields (hidden by default) -->
            <div id="matchingForm" style="display: none;">
                <!-- Boy Details -->
                <div class="matching-section">
                    <div class="section-title">Boy Details</div>
                    
                    <div class="form-group">
                        <label for="boy_name">Boy Name <span class="required">*</span></label>
                        <input type="text" id="boy_name" name="boy_name">
                    </div>
                    
                    <div class="form-group">
                        <label for="boy_dob">Boy Date of Birth (DD/MM/YYYY) <span class="required">*</span></label>
                        <input type="text" id="boy_dob" name="boy_dob" placeholder="DD/MM/YYYY">
                    </div>
                    
                    <div class="form-group">
                        <label for="boy_tob">Boy Time of Birth (HH:MM) <span class="required">*</span></label>
                        <input type="text" id="boy_tob" name="boy_tob" placeholder="HH:MM">
                    </div>
                    
                    <div class="form-group">
                        <label for="boy_place">Boy Place of Birth <span class="required">*</span></label>
                        <input type="text" id="boy_place" name="boy_place" placeholder="Start typing place name...">
                    </div>
                    
                    <!-- Hidden fields for Boy Latitude and Longitude -->
                    <input type="hidden" id="boy_lat" name="boy_lat">
                    <input type="hidden" id="boy_lon" name="boy_lon">
                    <input type="hidden" id="boy_tz" name="boy_tz" value="5.5">
                </div>
                
                <!-- Girl Details -->
                <div class="matching-section">
                    <div class="section-title">Girl Details</div>
                    
                    <div class="form-group">
                        <label for="girl_name">Girl Name <span class="required">*</span></label>
                        <input type="text" id="girl_name" name="girl_name">
                    </div>
                    
                    <div class="form-group">
                        <label for="girl_dob">Girl Date of Birth (DD/MM/YYYY) <span class="required">*</span></label>
                        <input type="text" id="girl_dob" name="girl_dob" placeholder="DD/MM/YYYY">
                    </div>
                    
                    <div class="form-group">
                        <label for="girl_tob">Girl Time of Birth (HH:MM) <span class="required">*</span></label>
                        <input type="text" id="girl_tob" name="girl_tob" placeholder="HH:MM">
                    </div>
                    
                    <div class="form-group">
                        <label for="girl_place">Girl Place of Birth <span class="required">*</span></label>
                        <input type="text" id="girl_place" name="girl_place" placeholder="Start typing place name...">
                    </div>
                    
                    <!-- Hidden fields for Girl Latitude and Longitude -->
                    <input type="hidden" id="girl_lat" name="girl_lat">
                    <input type="hidden" id="girl_lon" name="girl_lon">
                    <input type="hidden" id="girl_tz" name="girl_tz" value="5.5">
                </div>
                
                <!-- Language for Matching -->
                <div class="form-group">
                    <label for="matching_lang">Language <span class="required">*</span></label>
                    <select id="matching_lang" name="matching_lang">
                        <option value="">Select Language</option>
                        <option value="en" selected>English</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>
            </div>
            
            <!-- Company Details (Optional) -->
            <div class="form-group">
                <label for="company_name">Company Name (Optional)</label>
                <input type="text" id="company_name" name="company_name" value="GRAHASTITHI ASTROLOGY CONSULTATIONS">
            </div>
            
            <div class="form-group">
                <label for="company_address">Company Address (Optional)</label>
                <input type="text" id="company_address" name="company_address" value="Kudavelly, Akberpet Bhoompally, Siddipet, Telangana">
            </div>
            
            <div class="form-group">
                <label for="company_email">Company Email (Optional)</label>
                <input type="email" id="company_email" name="company_email" value="contact@jyotishamastroapi.com">
            </div>
            
            <div class="form-group">
                <label for="company_phone">Company Phone (Optional)</label>
                <input type="text" id="company_phone" name="company_phone" value="9573854546">
            </div>
            
            <div class="form-group">
                <label for="company_website">Company Website (Optional)</label>
                <input type="text" id="company_website" name="company_website" value="https://jyotishamastroapi.com/">
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">Generate PDF Report</button>
            
            <!-- Loader -->
            <div class="loader" id="loader">Generating PDF...</div>
        </form>
        
        <!-- Message Display Area -->
        <div class="message" id="message"></div>
    </div>
</body>
